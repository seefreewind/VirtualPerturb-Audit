dataset:
  name: Replogle_K562_filtered
  label: Replogle_GEARS_filtered
  source_h5ad: data/raw/replogle/replogle_k562_essential/perturb_processed.h5ad
  filtered_data: true
model:
  name: gears
  version: 0.1.2
  mode: official_reproduction
  pert_graph: essential
  gene_set_path: data/raw/essential_all_data_pert_genes.pkl
  hidden_size: 64
  num_go_gnn_layers: 3
  num_gene_gnn_layers: 3
  decoder_hidden_size: 128
  num_similar_genes_go_graph: 20
  num_similar_genes_co_express_graph: 20
  coexpress_threshold: 0.4
  learning_rate: 0.001
  weight_decay: 0.0005
  optimizer: Adam
  scheduler: StepLR_step1_gamma0.5
split:
  level: R-L1-K562
  splitter: assign_replogle_l1_context_perturbation_holdout
  split_hash: e9fcaf7afdb972e4
  frozen: true
seed: 1
training:
  epochs: 20
  batch_size: 16
  test_batch_size: 16
  device: cpu
evaluation:
  scope: full_test_loader
  primary_metrics:
    - pearson_delta
    - retrieval_mrr
    - uer50
  secondary_metrics:
    - retrieval_top1
    - retrieval_top5
    - sign_flip_rate
    - spearman_delta
    - rmse_delta
    - cosine_delta
    - uer20
    - uer100
  statistical_unit: perturbation
  bootstrap_resamples: 2000
  ci: 95
bns:
  status: UNVERIFIED
  role: sensitivity_only
output_dir: results/replogle/gears
reporting:
  dataset_label: Replogle GEARS-compatible filtered essential-screen data
  performance_eligible: true
  hard_rules:
    - do_not_call_full_replogle_dataset
    - bns_status_must_remain_UNVERIFIED